[package]
name = "certchain"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Verifiable academic certificates on a simple blockchain"
license-file = "LICENSE"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
ed25519-dalek = "3"
getrandom = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
